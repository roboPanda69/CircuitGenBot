[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schematic-ai"
version = "0.1.0"
description = "AI-assisted schematic design foundations with RequirementModel v0.1."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schematic_ai"]

